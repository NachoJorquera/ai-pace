name: Release

# Pushing a `v<version>` tag publishes a GitHub release with the DMG attached. The tag must match
# CFBundleShortVersionString in Info.plist, and CHANGELOG.md must have a section for that version.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check tag matches Info.plist
        run: |
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/Sources/AIPace/Info.plist)"
          if [[ "v${plist_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Info.plist version ${plist_version}" >&2
            exit 1
          fi

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [[ -z "$(tr -d '[:space:]' < release-notes.md)" ]]; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" "dist/AIPace-${version}.dmg" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AIPace ${version}" \
            --notes "$(cat release-notes.md)" \
            --generate-notes
